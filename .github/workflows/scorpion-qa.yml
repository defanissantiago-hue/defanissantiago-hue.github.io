name: Scorpion — QA sin credenciales
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar módulos ES y validar importaciones
        run: node --experimental-vm-modules tests/check-imports.mjs
      - name: Validar funcionalidades de entrenamiento y seguridad de HTML
        run: node --experimental-vm-modules tests/features.cjs
      - name: Regresiones de fechas, sesiones, pagos y rutinas
        run: node --experimental-vm-modules tests/regression.cjs
